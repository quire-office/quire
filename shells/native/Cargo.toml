[package]
name = "quire-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native headless shell (Phase 0 的 CLI 頭；Phase 2 換 winit+wgpu 殼)"

[[bin]]
name = "quire-cli"
path = "src/main.rs"

[dependencies]
# xlsx feature：X1 卡的 roundtrip-xlsx 閘門面（容器級無損＋workbook 投影）。
# 拆包紀律：只有 native 殼開它，主 wasm（quire-web）不帶。
quire-engine = { workspace = true, features = ["xlsx"] }
# ODF-C3：odt-render 子命令（ODT 文字流投影首切片）。分層紀律：layout 型別
# 經 quire-odf 的 layout_glue 再匯出取用，殼層不直接 import quire-layout。
quire-odf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
