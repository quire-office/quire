[package]
name = "quire-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Line breaking + budgeted pagination (platform-free; real shaping via embedded Noto Sans TC subset)"

[dependencies]
serde = { workspace = true }
# 真字型 shaping（harfbuzz 級）：連字、標點壓縮、組合字都如實反映在 advances。
# default-features=false：不准系統字型探索——分頁一致性只准來自內嵌子集
# （wasm32 上也沒有系統字型可用）。
swash = { workspace = true }
unicode-linebreak = { workspace = true }
