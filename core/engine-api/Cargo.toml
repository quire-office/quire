[package]
name = "quire-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The single contract between cores and shells: open/edit/query layout. wasm-safe."

[dependencies]
quire-ooxml = { workspace = true }
quire-layout = { workspace = true }
quire-render-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
quire-crdt = { workspace = true, optional = true }
# XLSX 容器面（X1）：預設**不帶**——與 collab 同款拆包紀律，主 wasm 首包不含
# xlsx 程式碼；quire-cli（native 開發頭）開此 feature 取 round-trip 閘門面。
quire-xlsx = { workspace = true, optional = true }

[dev-dependencies]
# K19 紅燈測試需在測試內解 PNG（deflate 解 IDAT）；dev-only，不進 wasm 首包
# （cargo tree -e normal 不含 dev-deps，分層/體積閘門不受影響）。
flate2 = { workspace = true }

[features]
default = []
# 協作面（CRDT 會話）。主 wasm 預設**不帶**此 feature——拆包閘門
# （scripts/check-wasm-size.mjs + CI cargo tree 守衛）保證首包不含 crdt 程式碼；
# 協作程式碼只活在延遲載入的 shells/web-collab 產物裡。
collab = ["dep:quire-crdt"]
# XLSX 容器面（X1）。同樣預設不帶（首包體積紀律）；shells/native 開它。
xlsx = ["dep:quire-xlsx"]
