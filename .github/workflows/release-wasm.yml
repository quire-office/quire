name: Release wasm（playground 引擎資產管線）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '要發佈的版本標籤（ex. v0.1.0-beta.2）'
        required: true

permissions:
  contents: write   # 僅發佈 release 與掛資產用

# 本 workflow 只做一件事：把 shells/web 的 wasm 產物變成 GitHub release 資產，
# 供 quire-office.github.io 的 scripts/fetch-wasm.mjs 匿名拉取（sha256 記於
# 該 repo 的 playground.assets.json）。CI 矩陣（測試閘門）屬 ci.yml，兩者分離：
# 發佈不需重跑跨平台矩陣，但 tag 觸發前 CI 必須已綠（main 綠才配打 tag）。
jobs:
  build-wasm:
    name: 建置並發佈 wasm 資產
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安裝 stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 安裝 wasm-pack（checksum 校驗：供應鏈加固，sha 實抓於 2026-11-02）
        run: |
          set -euo pipefail
          # wasm-pack v0.13.1 musl tarball——SHA-256 由 PM 本機實抓後寫死；
          # 下載落檔校驗通過才解壓，任何漂移直接擋發布。
          WPK_SHA256=c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539
          WPK_URL=https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz
          curl -sL -o wasm-pack.tar.gz "$WPK_URL"
          echo "$WPK_SHA256  wasm-pack.tar.gz" | sha256sum -c -
          tar xzf wasm-pack.tar.gz
          cp wasm-pack-*/wasm-pack ~/.cargo/bin/
          wasm-pack --version

      - name: 建置首包＋協作分塊（與本機同命令）
        working-directory: shells/web
        run: |
          cargo build -q --release -p quire-web --target wasm32-unknown-unknown
          wasm-pack build --target web --out-dir pkg --release
          wasm-pack build ../web-collab --out-dir ../web-collab/pkg --target web --release

      - name: 體積閘門（首包 gzip ≤ 3MB，CI 拆包契約）
        working-directory: shells/web
        run: npm run size

      - name: 產物清單（sha256 寫入 release 內文）
        id: digest
        working-directory: shells/web
        run: |
          sha256sum pkg/quire_web_bg.wasm pkg/quire_web.js ../web-collab/pkg/quire_web_collab_bg.wasm > /tmp/sha256.txt
          cat /tmp/sha256.txt

      - name: 建/更新 release 並掛資產
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          prerelease: true
          body_path: /tmp/sha256.txt
          files: |
            shells/web/pkg/quire_web_bg.wasm
            shells/web/pkg/quire_web.js
            shells/web/../web-collab/pkg/quire_web_collab_bg.wasm
