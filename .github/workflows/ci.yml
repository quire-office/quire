name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新 push 取消舊跑（三 OS 矩陣很貴，別排隊）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 三 OS 的預設 shell 統一 bash：Windows 走 Git Bash，避免 PowerShell/cmd 的引號與
# 管線語意差異讓同一支指令在三個平台上行為不同。
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ── 跨平台矩陣：ubuntu + windows × 雙 target（host native + wasm32-unknown-unknown）──
  # 每個 OS 都跑完整閘門組（clippy/test/golden/round-trip/wasm/分層）。理由：
  #   · round-trip 號稱「未觸碰位元級原樣搬運」，只有在三個 OS 都綠才算數——
  #     path 比較、字元編碼、檔案開啟模式都藏在 std::fs 底下，是最容易只在一平台爆的地方。
  #   · wasm32 的產出與連結吃各 OS 的工具鏈，只有在 windows/macOS 上也產出 .wasm 才叫雙目標。
  # 快取刻意不做：依賴只有 35 個 crate、全量編譯約 5 秒，target/ 快取反倒帶來
  # 跨 OS 汙染與快取損壞的偽紅燈風險。
  # OS 涵蓋 amd64 與 arm64：ubuntu-latest / windows-latest 是 x86_64，
  # macos-latest（獨立 job）是 Apple Silicon（aarch64-apple-darwin），三種 host 架構都覆蓋到。
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一個 OS 紅不要順手殺掉另外兩個：跨平台除錯要一次看全三平台的失敗清單。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: 工具鏈版本（紅燈時先確認不是 runner 換版）
        run: rustc -vV && cargo -V

      # fmt 只在 ubuntu 當基準：格式化結果不該隨 OS 不同，跑三份只是浪費。
      # Windows 檢出的換行由 .gitattributes 鎖成 LF（Windows runner 的 git 預設
      # core.autocrlf=true，沒鎖的話 `cargo fmt --check` 會在 Windows 假性紅燈）。
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      # clippy 用各 OS 的 host target 本機編譯：OS 專屬的 cfg 分支與 lint 都要零警告。
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test（native）
        run: |
          cargo test --workspace
          cargo test -p quire-engine -p quire-crdt --features collab
      - name: ★ golden 閘門——shaping 斷點＋分頁斷點快照（演算法變更須 UPDATE_GOLDENS=1 並逐條審 diff）
        run: cargo run -q -p quire-layout --bin goldens

      - name: ★ round-trip 閘門——開檔→不動→存檔，未觸碰部分必須零失真（全平台）
        run: |
          cargo run -q -p quire-cli -- roundtrip fixtures --check
          # corpus/ 由 Phase0-1 落地＋擴充（400 份真實世界 docx，追蹤於 git；
          # corpus/quarantine.json 內隔離檔不計紅），三平台都要零失真。
          cargo run -q -p quire-cli -- roundtrip corpus --check
          # benches/corpus（benchmark 語料，尚未進 git）：有檔就全部必須綠，暫空則警告留綠。
          mkdir -p benches/corpus
          if find benches/corpus -name '*.docx' | grep -q .; then
            cargo run -q -p quire-cli -- roundtrip benches/corpus --check
          else
            echo "::warning::benches/corpus 是空的——benchmark 語料落地後此閘門才會真的咬合"
          fi
          # ★ X1：XLSX/XLSM 容器級閘門——corpus-xlsx 全 80 檔未觸碰存檔必須
          # byte-identical（DOCX 的無損紀律複製到第二格式的證明；失真即紅）。
          cargo run -q -p quire-cli -- roundtrip-xlsx fixtures --check
          cargo run -q -p quire-cli -- roundtrip-xlsx corpus-xlsx --check

      # ★ P0-6 性能閘門：500 頁檔打字輸入延遲 p95 < 8ms（debug info release build，
      # 貼近 ship 配置；增量重排退化成整篇重建會直接咬紅這裡）。
      - name: ★ 輸入延遲閘門——500 頁打字 p95<8ms（增量重排回歸測試）
        if: matrix.os == 'ubuntu-latest'
        run: |
          CARGO_PROFILE_RELEASE_DEBUG=1 cargo run --release -q -p quire-layout --example p6_bench

      - name: ★ 雙目標鐵律——core 必須可編譯進 wasm32（全平台）
        run: |
          cargo check -p quire-ooxml -p quire-layout -p quire-render-trait \
            -p quire-crdt -p quire-engine -p quire-xlsx -p quire-odf --target wasm32-unknown-unknown
          cargo check -p quire-web -p quire-web-collab --target wasm32-unknown-unknown
          # collab feature 也要能編（協作分塊的依賴組合）。
          cargo check -p quire-engine --features collab --target wasm32-unknown-unknown
          # xlsx feature 也要能編（XLSX 分塊走同款拆包紀律：native/未來 wasm
          # 分塊可載入，但主 wasm 首包不帶——分層閘門守這條）。
          cargo check -p quire-engine --features xlsx --target wasm32-unknown-unknown

      # check 只證明過型，連結才是 wasm 殼真正的收尾；三個 OS 各自的 rust-lld 都要能產貨。
      - name: wasm 殼實際連結出 .wasm（全平台）
        run: |
          cargo build --target wasm32-unknown-unknown -p quire-web
          ls -l target/wasm32-unknown-unknown/debug/*.wasm

      - name: ★ 拆包＋分層鐵律——CRDT 只准活在協作分塊；core↛shells
        run: bash scripts/check-layering.sh

  # macOS 拆成獨立 job：免費層 macOS runner 計價 ×10 倍率（private 時代的額度黑洞；
  # 公開後標準 runner 無限額，此閘門留著擋 PR 階段的無謂排程）。
  # 注意：job 層 if 沒有 matrix context，所以 macOS 不能留在三 OS 矩陣內做守門。
  #
  # ⏸ 暫時停用（用戶指示，省 macOS 額度）。重啟 = 把下面的 if 改回：
  #     if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
  #     並把 ci-green 的 macos_ok 規則改回「main 上 skipped 視為紅」。
  cross-platform-macos:
    name: cross-platform (macos-latest)
    runs-on: macos-latest
    if: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: 工具鏈版本（紅燈時先確認不是 runner 換版）
        run: rustc -vV && cargo -V

      # macos-latest 是 Apple Silicon，host triple 是 aarch64；矩陣要求 amd64 也必須綠，
      # 所以在 macOS 補一格 x86_64-apple-darwin 的編譯+lint 覆蓋（只 check 不執行）。
      - name: macOS amd64 target 編譯覆蓋（macos-latest 是 arm64 host）
        run: |
          rustup target add x86_64-apple-darwin
          cargo clippy --workspace --all-targets --target x86_64-apple-darwin -- -D warnings

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test（native）
        run: |
          cargo test --workspace
          cargo test -p quire-engine -p quire-crdt --features collab

      - name: ★ golden 閘門——shaping 斷點＋分頁斷點快照
        run: cargo run -q -p quire-layout --bin goldens

      - name: ★ round-trip 閘門——開檔→不動→存檔，未觸碰部分必須零失真
        run: |
          cargo run -q -p quire-cli -- roundtrip fixtures --check
          cargo run -q -p quire-cli -- roundtrip corpus --check

      - name: ★ 雙目標鐵律——core 必須可編譯進 wasm32
        run: |
          cargo check -p quire-ooxml -p quire-layout -p quire-render-trait \
            -p quire-crdt -p quire-engine --target wasm32-unknown-unknown
          cargo check -p quire-web -p quire-web-collab --target wasm32-unknown-unknown
          cargo check -p quire-engine --features collab --target wasm32-unknown-unknown

      - name: wasm 殼實際連結出 .wasm
        run: |
          cargo build --target wasm32-unknown-unknown -p quire-web
          ls -l target/wasm32-unknown-unknown/debug/*.wasm

      - name: ★ 拆包＋分層鐵律——CRDT 只准活在協作分塊；core↛shells
        run: bash scripts/check-layering.sh

  wasm-size:
    # Web-2：wasm 拆包＋首包體積閘門（記錄 gzip 尺寸、閘死 CRDT 不進首包）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 建置兩個 wasm 分塊（首包＋協作）
        run: |
          cd shells/web && npm ci
          npm run build:wasm
          npm run build:collab
      - name: vite 打包 demo（驗證 code-splitting 真實性）
        run: cd shells/web && npm run build:demo
      - name: ★ 包體積閘門——首包 gzip<3MB＋假拆包符號檢查（記錄進 log+artifact）
        run: node scripts/check-wasm-size.mjs --json build/wasm-size.json
      - name: Node smoke——兩個分塊真實功能（開檔/編輯/協作合併，免瀏覽器）
        run: node scripts/wasm-smoke.mjs
      - name: ★ IME 注入閘門——注音/倉頌/emoji 經隱形 contenteditable 錨點進引擎（Playwright+CDP）
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/ime-inject-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-size-report
          path: build/wasm-size.json

  # ── 匯總閘門：branch protection 只准綁 `ci-green` 這一項 ──
  # 綁各 OS 的 job 名字的話，矩陣一改就要重設多項 required check；綁這一項，矩陣怎麼長都不動設定。
  ci-green:
    name: ci-green
    needs: [cross-platform, cross-platform-macos, wasm-size]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 任何一個 job 紅，匯總就紅
        run: |
          result_x='${{ needs.cross-platform.result }}'
          result_m='${{ needs.cross-platform-macos.result }}'
          result_s='${{ needs.wasm-size.result }}'
          echo "cross-platform 彙總結果: $result_x"
          echo "cross-platform-macos 彙總結果: $result_m"
          echo "wasm-size 彙總結果: $result_s"
          # macOS job 目前 if: false 停用（省額度）→ skipped 一律視為綠。
          # 重啟 macOS 時改回：main push 上 skipped 必須視為紅（macOS 是 arm64 覆蓋的唯一來源）。
          macos_ok=true
          if [ "$result_m" != "success" ] && [ "$result_m" != "skipped" ]; then
            macos_ok=false
          fi
          if [ "$result_x" != "success" ] || [ "$result_s" != "success" ] || [ "$macos_ok" != "true" ]; then
            echo "::error::CI 未全綠（cross-platform=$result_x, macos=$result_m, wasm-size=$result_s, macos_ok=$macos_ok）——見各 job log"
            exit 1
          fi
          echo "✓ 三 OS ×（native + wasm32）＋拆包/體積閘門全綠"
